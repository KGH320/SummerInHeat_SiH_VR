name: Build and Release UnityVRMod

on:
  push:
    branches: [main, dev]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add Visual Studio 2026 MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Verify VS 2026 and v145 project toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msbuild = (Get-Command msbuild -ErrorAction Stop).Source
          $versionOutput = & $msbuild -nologo -version
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild version check failed with exit code $LASTEXITCODE."
          }
          $versionMatch = [regex]::Match(($versionOutput -join "`n"), '(?m)^\s*(?<version>\d+\.\d+(?:\.\d+){0,2})\s*$')
          if (-not $versionMatch.Success) {
            throw 'Could not parse the MSBuild version.'
          }
          $version = [Version]$versionMatch.Groups['version'].Value
          if ($version.Major -ne 18) {
            throw "MSBuild 18 is required; found $version at $msbuild."
          }

          [xml]$project = Get-Content -LiteralPath 'UnityGraphicsHelper/UnityGraphicsHelper.vcxproj'
          $namespace = [System.Xml.XmlNamespaceManager]::new($project.NameTable)
          $namespace.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $toolsets = @($project.SelectNodes('//msb:PlatformToolset', $namespace))
          if ($toolsets.Count -ne 4 -or @($toolsets | Where-Object { $_.InnerText -ne 'v145' }).Count -ne 0) {
            throw 'All four native project configurations must use PlatformToolset v145.'
          }
          $windowsSdk = $project.SelectSingleNode('//msb:WindowsTargetPlatformVersion', $namespace).InnerText
          if ($windowsSdk -ne '10.0') {
            throw "WindowsTargetPlatformVersion must remain 10.0; found '$windowsSdk'."
          }

      - name: Build Mono targets
        shell: pwsh
        run: ./build.ps1 -MonoOnly

      - name: Verify native exports, PE architecture, and package hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installationPath = & $vswhere -latest -products * -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Could not locate the VS 2026 C++ installation.'
          }

          $dumpbin = Get-ChildItem -Path (Join-Path $installationPath 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found in the VS 2026 installation.'
          }

          $nativeReference = (Resolve-Path 'UnityGraphicsHelper/x64/Release/UnityGraphicsHelper.dll').Path
          $headers = & $dumpbin.FullName /headers $nativeReference
          if ($LASTEXITCODE -ne 0 -or ($headers -join "`n") -notmatch '(?im)^\s*8664\s+machine\s+\(x64\)') {
            throw 'UnityGraphicsHelper.dll is not an x64 PE image.'
          }

          $escapedNativeReference = $nativeReference.Replace('\', '\\')
          Add-Type -TypeDefinition @"
          using System.Runtime.InteropServices;
          public static class UnityGraphicsHelperAbiProbe
          {
              [DllImport("$escapedNativeReference", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
              public static extern int GetUnityGraphicsHelperAbiVersion();
          }
          "@
          $abiVersion = [UnityGraphicsHelperAbiProbe]::GetUnityGraphicsHelperAbiVersion()
          if ($abiVersion -ne 2) {
            throw "UnityGraphicsHelper ABI v2 is required; native helper returned v$abiVersion."
          }

          $exports = & $dumpbin.FullName /exports $nativeReference
          if ($LASTEXITCODE -ne 0) {
            throw 'dumpbin export inspection failed.'
          }
          $exportText = $exports -join "`n"
          $bridgeSource = Get-Content -LiteralPath 'src/Features/VRVisualization/OpenXR/NativeBridge.cs' -Raw
          $entryPoints = @([regex]::Matches($bridgeSource, 'EntryPoint\s*=\s*"(?<name>[^"]+)"') | ForEach-Object { $_.Groups['name'].Value })
          $requiredExports = @('UnityPluginLoad', 'UnityPluginUnload') + $entryPoints | Sort-Object -Unique
          foreach ($requiredExport in $requiredExports) {
            $escapedName = [regex]::Escape($requiredExport)
            if ($exportText -notmatch "(?m)^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+$escapedName(?:\s|$)") {
              throw "Required native export '$requiredExport' was not found."
            }
          }

          $referenceHash = (Get-FileHash -LiteralPath $nativeReference -Algorithm SHA256).Hash
          $helperCopies = @('lib/UnityGraphicsHelper.dll') + @(
            Get-ChildItem -LiteralPath 'Release/OpenXR' -Recurse -File -Filter 'UnityGraphicsHelper.dll' |
              Select-Object -ExpandProperty FullName
          )
          if ($helperCopies.Count -lt 5) {
            throw "Expected lib plus four OpenXR helper copies; found $($helperCopies.Count)."
          }
          foreach ($helperCopy in $helperCopies) {
            $copyHash = (Get-FileHash -LiteralPath $helperCopy -Algorithm SHA256).Hash
            if ($copyHash -ne $referenceHash) {
              throw "Native helper hash mismatch: '$helperCopy' is $copyHash; expected $referenceHash."
            }
          }

      - name: Get version name
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $version = '${{ github.event.release.tag_name }}'
          } else {
            $version = 'ci-${{ github.sha }}'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Archive builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builds = [ordered]@{
            'OpenXR-Mono' = 'Release/OpenXR/UnityVRMod.BepInEx.Mono/*'
            'OpenXR-BIE5-Mono' = 'Release/OpenXR/UnityVRMod.BepInEx5.Mono/*'
            'OpenVR-Mono' = 'Release/OpenVR/UnityVRMod.BepInEx.Mono/*'
            'OpenVR-BIE5-Mono' = 'Release/OpenVR/UnityVRMod.BepInEx5.Mono/*'
          }
          foreach ($build in $builds.GetEnumerator()) {
            Compress-Archive -Path $build.Value -DestinationPath "UnityVRMod-${{ env.VERSION }}-$($build.Key).zip"
          }

      - name: Upload assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: UnityVRMod-*.zip

      - name: Upload CI artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: UnityVRMod-Builds-${{ env.VERSION }}
          path: UnityVRMod-*.zip
